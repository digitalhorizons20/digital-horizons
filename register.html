<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register Your Child - Digital Horizons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Navigation -->
  <nav class="main-nav">
    <div class="nav-container">
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Digital Horizons Logo">
        </a>
      </div>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="programs.html">Programs</a></li>
        <li><a href="practice.html">Practice</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="register.html" class="active">Register</a></li>
      </ul>
    </div>
  </nav>
  <!-- Hero Banner -->
  <header class="hero small">
    <h1>Register Your Child</h1>
    <p>Fill out the form below to enroll your child</p>
  </header>

  <!-- Registration Form -->
  <section class="form-section">
    <div class="form-box">
      <form action="https://formspree.io/f/mojbjenw" method="post">
        <label for="parentName">Parent’s Name:</label>
        <input type="text" id="parentName" name="parentName" required>

        <label for="parentEmail">Parent’s Email:</label>
        <input type="email" id="parentEmail" name="parentEmail" required>

        <label for="whatsapp">WhatsApp Number:</label>
        <input type="tel" id="whatsapp" name="whatsapp" placeholder="+251912345678" required>

        <label for="childName">Child’s Name:</label>
        <input type="text" id="childName" name="childName" required>

        <label for="childAge">Child’s Age:</label>
        <input type="number" id="childAge" name="childAge" min="4" max="18" required>

        <label for="language">Preferred Language:</label>
        <select id="language" name="language">
          <option value="english">English</option>
          <option value="amharic">Amharic</option>
          <option value="tigrinya">Tigrinya</option>
        </select>

        <button type="submit" class="cta-button">Register</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Digital Horizons | digitalhorizons2026@gmail.com | +254-748-100-820</p>
  </footer>

  <!-- Mobile Nav Script -->
  <script>
    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });
  </script>
</body>
</html>
