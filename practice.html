<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Practice HTML - Digital Horizons</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main Navigation -->
  <nav class="main-nav">
    <div class="nav-container">
      <div class="logo">
        <a href="index.html">
          <img src="logo.png" alt="Digital Horizons Logo">
        </a>
      </div>
      <button class="menu-toggle">☰</button>
      <ul class="nav-links">
  <li><a href="index.html">Home</a></li>
  <li><a href="about.html">About Us</a></li>
  <li><a href="programs.html">Programs</a></li>
  <li><a href="courses.html">Courses</a></li>
  <li><a href="practice.html"class="active">Practice</a></li>
  <li><a href="courses.html">Courses</a></li>
  <li><a href="contact.html">Contact</a></li>
</ul>

    </div>
  </nav>


  <!-- Hero Banner -->
  <header class="hero small">
    <h1>Practice HTML</h1>
    <p>Type your code and see it live!</p>
  </header>

  <!-- Practice Simulator -->
  <section class="practice">
    <div class="cards">
      <div class="card1">
        <h2>Practice at Digital Horizons</h2>
        <textarea id="htmlCode" rows="10" cols="50">
<!DOCTYPE html>
<html>
<h1>Hello World!</h1>
<p>This is my first HTML practice.</p>
</html>
        </textarea>
        <br>
        <button onclick="runCode()">Run Code</button>
        <iframe id="output" style="width:100%; height:300px; border:1px solid #ccc; margin-top:1rem;"></iframe>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 Digital Horizons | digitalhorizons2026@gmail.com | +254-748-100-820</p>
  </footer>

  <!-- Scripts -->
  <script>
    function runCode() {
      const code = document.getElementById('htmlCode').value;
      const iframe = document.getElementById('output');
      iframe.contentDocument.open();
      iframe.contentDocument.write(code);
      iframe.contentDocument.close();
    }

    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelector('.nav-links');
    toggle.addEventListener('click', () => {
      navLinks.classList.toggle('show');
    });
  </script>
</body>
</html>
