  <!-- Practice Simulator -->
  <section class="practice">
  <div class="cards">
      <div class="card1">
    <h2>Practice at Digital Horizons</h2>
    <textarea id="htmlCode" rows="10" cols="50">
<!DOCTYPE html>
<html>
<h1>Hello World!</h1>
<p>This is my first HTML practice.</p>
</html>
    </textarea>
    <br>
    <button onclick="runCode()">Run Code</button>
    <iframe id="output" style="width:100%; height:300px; border:1px solid #ccc; margin-top:1rem;"></iframe>
  
  </div>
    </div>
</section>

  <script>
    function runCode() {
      const code = document.getElementById('htmlCode').value;
      const iframe = document.getElementById('output');
      iframe.contentDocument.open();
      iframe.contentDocument.write(code);
      iframe.contentDocument.close();
    }
  </script>
