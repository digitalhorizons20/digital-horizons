<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Digital Horizons</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #0b2740, #744700);
      color: white;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 300px;   /* controlled height */
      overflow: hidden;
    }

    .hero-slider {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .hero-slider .slide {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .hero-slider .slide.active {
      opacity: 1;
    }

    .hero-slider img,
    .hero-slider video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding-top: 80px;
    }

    .cta-button {
      background: #FFD700;
      color: #0b2740;
      padding: 0.7rem 1.5rem;
      text-decoration: none;
      font-weight: bold;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-slider">
      <div class="slide active">
        <img src="kids1.jpg" alt="Kids coding">
      </div>
      <div class="slide">
        <img src="kids2.jpg" alt="Kids studying">
      </div>
      <div class="slide">
        <video autoplay muted loop>
          <source src="kids-tech.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div class="hero-content">
      <h1>Welcome to Digital Horizons</h1>
      <p>Turning screen time into creativity and future-ready skills</p>
      <a href="register.html" class="cta-button">Register Now</a>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const slides = document.querySelectorAll(".hero-slider .slide");
      let index = 0;

      setInterval(() => {
        slides[index].classList.remove("active");
        index = (index + 1) % slides.length;
        slides[index].classList.add("active");
      }, 5000); // change every 5 seconds
    });
  </script>

</body>
</html>
